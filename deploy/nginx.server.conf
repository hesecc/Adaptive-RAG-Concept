# Install as /www/server/panel/vhost/nginx/an-rag.conf only after checking
# active AND reserved ports. Test the existing Nginx before reloading it.
# This file belongs in an http-context include, as used by the host panel.
limit_req_zone $binary_remote_addr zone=an_rag_requests:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=an_rag_connections:10m;

server {
    listen 18444 ssl;
    server_name 110.42.51.234;

    # Independent certificate/key; the leaf must contain IP:110.42.51.234 SAN.
    ssl_certificate /opt/an-RAG/tls/server.crt;
    ssl_certificate_key /opt/an-RAG/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:an_rag_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 12m;
    client_body_timeout 15s;
    send_timeout 150s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn an_rag_connections 8;

    # Omit request URI/query strings, bodies and Authorization from logs.
    # Docker logs have separate rotation; configure host logrotate for this file.
    access_log off;
    error_log /opt/an-RAG/logs/nginx-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    location / {
        limit_req zone=an_rag_requests burst=10 nodelay;
        proxy_pass http://127.0.0.1:14175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Pass the application's independent an_rag_session cookie unchanged.
        proxy_connect_timeout 5s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }
}
