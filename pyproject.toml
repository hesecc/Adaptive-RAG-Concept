[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag-concept"
version = "0.1.0"
description = "A pluggable, model-free retrieval augmented generation foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pypdf>=7.1,<8",
  "uvicorn>=0.30,<1",
]

[project.scripts]
adaptive-rag = "adaptive_rag.cli:main"

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["adaptive_rag*"]

[tool.setuptools.package-data]
adaptive_rag = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
